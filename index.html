<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebNest Login</title>
    <link rel="icon" type="image/png" href="assets/WebNest_Logo.png">

    <link rel="stylesheet" href="style/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script/script.js" defer></script>
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="brand-lockup" aria-label="WebNest">
                <span>Web</span>Nest
            </div>

            <!-- Tela de login e cadastro -->
            <div id="auth-view">
                <h1 id="form-title">Entrar</h1>

                <div class="auth-tabs">
                    <button type="button" id="login-tab" class="auth-tab active">
                        Entrar
                    </button>

                    <button type="button" id="signup-tab" class="auth-tab">
                        Criar conta
                    </button>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="user">Usuário</label>
                        <input type="text" name="username" id="user" autocomplete="username" minlength="3"
                            maxlength="20" pattern="[a-zA-Z0-9_]+" required>
                    </div>

                    <div class="form-group" id="email-group" hidden>
                        <label for="email">E-mail</label>
                        <input type="email" name="email" id="email" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>

                        <div class="password-container">
                            <input type="password" name="password" id="password" autocomplete="current-password"
                                required>

                            <button type="button" id="toggle-password" aria-label="Mostrar senha">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                    stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Link de recuperação de senha -->
                    <button type="button" id="forgot-password-link" class="text-button">
                        Esqueci minha senha
                    </button>

                    <p id="login-message" role="status" aria-live="polite"></p>

                    <button type="submit" class="login-button">
                        Entrar
                    </button>
                </form>
            </div>

            <!-- Tela de recuperação de senha -->
            <div id="recovery-view" hidden>
                <h1>Recuperar senha</h1>

                <p class="welcome-description">
                    Digite o e-mail associado à sua conta. Enviaremos
                    um link para você criar uma nova senha.
                </p>

                <form id="recovery-form">
                    <div class="form-group">
                        <label for="recovery-email">E-mail cadastrado</label>
                        <input type="email" id="recovery-email" name="recovery-email" autocomplete="email"
                            placeholder="seu@email.com" required>
                    </div>

                    <p id="recovery-message" class="form-message" role="status" aria-live="polite"></p>

                    <button type="submit" class="login-button">
                        Enviar link de recuperação
                    </button>

                    <button type="button" id="back-to-login" class="text-button">
                        Voltar para o login
                    </button>
                </form>
            </div>

            <!-- Tela para definir uma nova senha -->
            <div id="reset-view" hidden>
                <h1>Nova senha</h1>

                <p class="welcome-description">
                    Escolha uma nova senha para sua conta.
                </p>

                <form id="reset-form">
                    <div class="form-group">
                        <label for="new-password">Nova senha</label>
                        <input type="password" id="new-password" name="new-password" autocomplete="new-password"
                            minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar nova senha</label>
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password"
                            minlength="6" required>
                    </div>

                    <p id="reset-message" class="form-message" role="status" aria-live="polite"></p>

                    <button type="submit" class="login-button">
                        Salvar nova senha
                    </button>
                </form>
            </div>

            <!-- Tela exibida após o login -->
            <div id="welcome-view" hidden>
                <div class="welcome-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5" />
                    </svg>
                </div>

                <h1>Você está conectado!</h1>

                <p class="welcome-description">
                    Boas-vindas à sua conta,
                </p>

                <p id="welcome-username" class="welcome-username"></p>

                <span class="connection-status">
                    <span class="status-dot"></span>
                    Sessão ativa
                </span>

                <button type="button" id="logout-button" class="login-button">
                    Sair da conta
                </button>
            </div>

        </section>
    </main>
</body>

</html>
